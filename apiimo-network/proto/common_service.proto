syntax = "proto2";

package phonest.proto;

option cc_generic_services = false;

message MsMetadata {
    optional string service = 1;
    optional string hint = 2;
    optional string callback = 3;
}

message MsRequest {
    optional uint64 rid       = 1;
    required string service   = 2;
    required string method    = 3;
    optional bytes params     = 4;
    optional string callerId  = 5;
    optional bytes context    = 7;
    optional bytes options    = 8; // options such as hint\labels\serviceId
    optional MsMetadata metadata = 9;
}

message MsResponse {
    optional uint64 rid         = 1;
    required bytes params       = 2;
    optional bytes context      = 3;
    optional string service_id  = 4;  // ID on which service handled
    optional MsMetadata metadata = 5;
}

message MsPush {
    optional string org_type  = 1[default="ENTITY"];  // organization type: ENTITY, CLUSTER,  WORLD
    repeated string ep_ids    = 2;  // Endpoint ids
}

message MsRegistration {
}

message MsRegistrationAck {
}

message MsDeregistration {
    optional string reason = 1;
    optional bytes metadata= 2;
}

message MsDeregistrationAck {
    optional bytes metadata         = 2;
}

message StatefulMsg {
	optional bytes params		= 4;	// seech.MessageProto
}

message EnumMicroProtocol {
    enum Type {
        MicroRequest    = 33;
        MicroResponse   = 34;
        MicroPush       = 35;
        MicroRegister   = 36;
        // MicroStreamMsg  = 38; 
        MicroStatefulMsg= 39;
        MicroRegisterAck= 40;
        MicroDeregisterAck= 41;
    }
}