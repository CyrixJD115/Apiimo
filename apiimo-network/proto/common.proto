syntax = "proto2";

package phonest.proto;

option cc_generic_services = false;

// Note: to optimize Gate forwarding, some messages combine fields from
// multiple parties. When that happens, the usage scope is documented per field:
// All : used by both ends
// ClientOnly : used by the client only
// ServerOnly : used by the server only

message Void {
	
}

message EntityMailbox{
}

message ServerInfo {
	optional string server_name = 1;
	optional int32 clusterId = 2;
}

message GateInfo {
	required bytes gateId = 1;
	required bytes ip = 3;
	required bytes publicIp = 4;
	required int32 port = 5;
	required int32 publicPort = 6;
	required int32 clusterId = 7;
}

message ClientInfo {
	optional bytes  ip = 1;         // Client IP
	optional int32  port = 2;       // Client Port
}

message ChannelEntityInfo {
}

message ClientEntityInfo {
}

message RecoverChannelEntityInfo {
}

message BindSoulInfo {
}

message UnbindSoulInfo {
}

message BindAvatarInfo {
}

message BindAccountInfo {
}



message ConnectServerReq {
	enum ReqType {
	}
	required ReqType type = 1;           // --All-- the connection request type
	optional bytes deviceId = 2;         // --ClientOnly-- device id: used for game-selection hashing and per-device connection tracking
	optional bytes clientInfo = 3;       // --ServerOnly-- client info built by the gate
	optional bytes auth = 4;             // --All-- authentication info
	optional bytes entityInfo = 5;       // --All-- Soul/Avatar/Account mailbox info or entityId (gate resolves mailbox to entityId)
    optional bytes version = 6;          // --All-- version info; used in development to check client/server version match
	optional uint32 lastClientRpcSeqId = 7; // --ClientOnly-- last server-to-client EntityMessage2CSection sequence the client processed
}

// hotfix sent after client connect
message HotfixType{
}

// reply to the client connect request
message ConnectServerResp{
	enum RespType {
		Busy = 0;	         // server busy
		Connected = 1;		 // connected
		ConnectRefused = 2;  // connection refused due to an error
	}
	enum RecoveryMode {
	}
}


// entity RPC: only between two entities that both have messaging rights
message EntityMessage {
	optional bytes entityId = 1;   // --All-- target entity id
	optional bytes methodName = 2; // --All-- RPC method name
	required bytes parameters = 4; // --All-- RPC parameters
	optional bytes context = 7;    //--All-- context of this RPC call
}

message EntityMessage2CSection {
	required bytes parameters = 3; // --All-- RPC parameters
}

message EntityMessage2C {
	required bytes parameters = 3; // --All-- RPC parameters
	repeated EntityMessage2CSection msgQueue = 5;
}

message ForwardEntityMessage {
	required bytes entityMailbox = 1; // --ServerOnly
	optional bytes methodName = 2; // --ServerOnly
	required bytes parameters = 3; // --ServerOnly
}

enum ChannelMessageType {
    Data 			= 0;
    KeepAlive 		= 1;   
    Close 			= 2;
	MigrateNotify 	= 3;
	RecoverNotify 	= 4;
}

message ReliableQueue {
	message Segment {
		optional uint32 ts		= 1;
		optional uint32 sn      = 2;
		optional uint32 una    	= 3;
		optional uint32 resendts= 4;
		optional uint32 rto     = 5;
		optional uint32 fastack = 6;
		optional uint32 xmit   	= 7;

		optional bytes context 	= 8;
		optional bytes message	= 9;
	}

	repeated Segment snd_queue	= 1;
	repeated Segment rcv_queue 	= 2;
	repeated Segment snd_buf  	= 3;
	repeated Segment rcv_buf  	= 4;

	optional uint32 nsnd_que  	= 5;
	optional uint32 nsnd_buf  	= 6;
	optional uint32 nrcv_buf  	= 7;
	optional uint32 dead_link 	= 8;

	optional uint32 rx_rto 		= 9;
	optional uint32 resent  	= 10;

	optional uint32 snd_una 	= 11;
	optional uint32 snd_nxt		= 12;
	optional uint32 rcv_nxt		= 13;
	optional uint32 snd_wnd 	= 14;
	optional uint32 rcv_wnd 	= 15;
}

message ChannelMessage {
    required ChannelMessageType type = 1;
    required int64 channelId = 2;
    optional bytes message = 3;    // --All--
}

message ForwardChannelMessage {
    required bytes entityMailbox = 1; // --ServerOnly
    required ChannelMessageType type = 2;
    required bytes channelId = 3;
    optional bytes message = 4; // --ServerOnly
}

message ChannelMessageData {
    enum DataType {
        Request = 0;
        Response = 1;
    }
    optional bytes methodName = 1;
    required bytes parameters = 2;
    required int64 rid = 3;
    required DataType type = 4;
}

message ReliableMessageData {
    enum ReliableType {
        Data = 0;
        Ack = 1;
    }
    required int32 una = 2;
    required int32 sn = 3;
    required ReliableType type = 4;
}

message AttachChannelInfo {
}

message AttachChannelResp {
	enum AttachChannelRespType {
	}
	required AttachChannelRespType type = 1; 
	required bytes srcmb = 2;
	required bytes dstid = 3;
	required bytes channelId = 4;
}

message MigrateInfo {
	required bytes entityId = 2;
}

// heartbeat
message Heartbeat {
	optional int64 time = 1;
	optional int64 connectionQuota = 2;
	optional int64 connectionAllocated = 3;
}

message PropertySyncClientMessage {
	optional bytes ownerid = 1;    // property owner id
	required int64 propertyid = 2; // property id
	required int32 optype = 3;     // change type
	required bytes name = 4;       // changed sub-property name
	optional bytes value = 5;      // changed value
}

message PropertyStrategySyncClientMessage {
	optional bytes ownerid = 2;    // property owner id
}

message PropertyIdSyncClientMessage {
	optional bytes ownerid = 1;    // property owner id
	required int64 propertyid = 2; // property id
	required bytes name = 3;       // changed sub-property name
}


message GlobalGate2ClientInfo {
	required bytes gateId = 1;
	required bytes sessionId = 2;
}

// global gate sends a message to the client
message GlobalGate2ClientMessageInfo {
	required bytes sessionId = 1;    // client connection id
	required bytes methodName = 2; // --All-- RPC method name
	required bytes parameters = 3; // --All-- RPC parameters
}

message SoulMessage {
    required bytes sessionId = 1; // --ServerOnly
    required bytes entityId = 2; // --ServerOnly
    required bytes bindId = 3;
	required bytes methodName = 4; // --All-- RPC method name
	required bytes parameters = 5; // --All-- RPC parameters
}

message PropertyDeclareType {
	optional bytes bundleConfig = 1;
	optional bytes customTypeConfig = 2;
}

message ForwardPayload {
	required uint32 targetMethod = 2;
}

message ForwardClientPayload {
	required bytes sessionId = 1;
	required ForwardPayload forward = 2;
}

message ForwardGamePayload {
	required string serverName = 1;
	optional int32 clusterId = 2;
	required ForwardPayload forward = 3;
}
