syntax = "proto2";

import "common.proto";
import "common_service.proto";

package phonest.proto;

option cc_generic_services = false;

// Note: to optimize Gate forwarding, some messages combine fields from
// multiple parties. When that happens, the usage scope is documented per field:
// All : used by both ends
// ClientOnly : used by the client only
// ServerOnly : used by the server only


message EncryptToken {
	required int64 token = 1; 	// token for the encryption process; each connection gets its own token to prevent replay attacks
	optional int32 compressLevel = 2;
	optional string compressType = 3;
}

message EncryptKey {
	required bytes key = 2;     // encrypted session key string
	required int64 token = 3;	// token for the encryption process; each connection gets its own token to prevent replay attacks
}

message EncryptKeyString {
}

// Client2Gate
service IClientGateService {
	rpc requestEncryptToken(Void) returns (Void);       // ask the gate for the encryption token
	rpc confirmEncryptKey(EncryptKeyString) returns (Void);   // confirm the encrypted key string with the gate
	rpc connectServer(ConnectServerReq) returns (Void); // client asks to connect to the game; no account verification here
	rpc entityMessage(EntityMessage) returns (Void);    // client calls an RPC method on a game-side entity with messaging rights
	rpc channelMessage(ChannelMessage) returns (Void);  // client calls a channel RPC on a game-side entity with messaging rights
	rpc heartbeat(Heartbeat) returns (Void);            // periodic client heartbeat to the gate
	rpc MicroServiceRequest(MsRequest) returns (Void); // micro-service request
}

// Gate2Client
service IGateClientService {
	rpc sendHotfix(HotfixType) returns (Void);         // push a hotfix to the client
	rpc connectResponse(ConnectServerResp) returns (Void);       // reply to the client connect request
	rpc entityMessage(EntityMessage) returns (Void);             // game calls an RPC on a client-side entity with messaging rights
	rpc ecsMessage(EntityMessage) returns (Void);                // game calls an RPC on a client-side ECS entity
	rpc channelMessage(ChannelMessage) returns (Void);           // client calls a channel RPC on a game-side entity with messaging rights
	rpc createChannelEntity(ChannelEntityInfo) returns (Void);   // tell the client to create a ChannelEntity (an entity with messaging rights, e.g. Account, Avatar)
	rpc disconnectClient(Void) returns (Void);                   // disconnect the client and tell it not to reconnect
	rpc bindAccount(BindAccountInfo) returns (Void);             // tell the client to bind the Account
	rpc bindAvatar(BindAvatarInfo) returns (Void);               // tell the client to bind the Avatar
	rpc bindSoul(BindSoulInfo) returns (Void);                   // tell the client to bind the Soul
	rpc unbindSoul(UnbindSoulInfo) returns (Void);               // tell the client to unbind the Soul
	rpc responseEncryptToken(EncryptToken) returns (Void);       // give the client the encryption token
	rpc confirmEncryptKeyAck(Void) returns (Void);               // tell the client the key string was confirmed
	rpc recvHeartbeat(Heartbeat) returns (Void);            	 // gate heartbeat reply to client
	rpc propertySync2Client(PropertySyncClientMessage) returns (Void); // sync property changes to the client
	rpc propertyStrategySync2Client(PropertyStrategySyncClientMessage) returns (Void); // strategy-based property sync to the client
	rpc recoverChannelEntity(RecoverChannelEntityInfo) returns (Void); // tell the client to recover a ChannelEntity
	rpc createClientEntity(ClientEntityInfo) returns (Void);    // tell the client to create a plain ClientEntity (no messaging rights, e.g. Monster)
	rpc propertyIdSync2Client(PropertyIdSyncClientMessage) returns (Void); // sync property ids to the client
	rpc regGlobalGate2Client(GlobalGate2ClientInfo) returns(Void);     // global gate registers itself to the client
	rpc globalGate2ClientMessage(GlobalGate2ClientMessageInfo) returns(Void); // global gate sends a message to the client
	rpc MicroServiceResponse(MsResponse) returns (Void);		// micro-service response
	rpc MicroServicePush(MsPush) returns (Void);				// micro-service push
	rpc sendPropertyDeclare(PropertyDeclareType) returns(Void); // send property declarations to the client
	rpc forwardPayload(ForwardPayload) returns(Void);           // new forwarding protocol: gate passes the payload through; client dispatches by targetMethod
}
