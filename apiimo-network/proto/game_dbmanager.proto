syntax = "proto2";

import "common.proto";

package phonest.proto;

option cc_generic_services = false;

// Note: to optimize Gate forwarding, some messages combine fields from
// multiple parties. When that happens, the usage scope is documented per field:
// All : used by both ends
// ClientOnly : used by the client only
// ServerOnly : used by the server only

message DBStatusInfo {
	enum DBType{
		Mongo = 0;
		Redis = 1;
		ClusterIdNotMatch = 2;
	}

	enum DBStatusType {
		Active = 0;
		Inactive = 1;
	}
	required DBType dbtype = 1;
	required DBStatusType status = 2;
}

message FindDocReq {
	required string db = 2;	        // db name
	required string collection = 3;  // collection name
}

message UpdateDocReq {
	required string db = 2;	        // db name
	required string collection = 3; // collection name
}

message DeleteDocReq {
	required string db = 2;	        // db name
	required string collection = 3; // collection name
}

message InsertDocReq {
	required string db = 2;	        // db name
	required string collection = 3;  // collection name
}

message FindAndModifyDocReq {
	required string db = 2;	        // db name
	required string collection = 3;  // collection name
}	

message CountDocReq {
	required string db = 2;	         // db name
	required string collection = 3;  // collection name
}

message RedisCommandReq {
	required bytes args = 2; // cmd args	
}

message RedisPipelineReq {
	required bytes args = 2; //cmd args array
}

message BulkWriteReq {
	required string db = 2;         // db name
	required string collection = 3; // collection name
}

//////////////////////////////////////////////////////////////////////////////

message FindDocReply {
}

message UpdateDocReply {
}

message DeleteDocReply {
}

message InsertDocReply {
}

message FindAndModifyDocReply {
}

message CountDocReply {
}

message RedisCommandReply {
}

message RedisPipelineReply {
}

message BulkWriteReply {
}


// Game2DBManager
service IGame2DBManagerService {
	rpc regGameServer(ServerInfo) returns (Void);
	rpc dbFindDoc(FindDocReq) returns (Void);
	rpc dbUpdateDoc(UpdateDocReq) returns (Void);
	rpc dbDeleteDoc(DeleteDocReq) returns (Void);
	rpc dbInsertDoc(InsertDocReq) returns (Void);
	rpc dbFindAndModifyDoc(InsertDocReq) returns (Void);
	rpc dbCountDoc(InsertDocReq) returns (Void);
	rpc redisCmdRequest(RedisCommandReq) returns (Void);
	rpc redisPipelineRequest(RedisPipelineReq) returns (Void);
	rpc dbBulkWrite(BulkWriteReq) returns (Void);
}

// DBManager2Game
service IDBManager2GameService {
	rpc syncDBStatus(DBStatusInfo) returns (Void);
	rpc dbFindDocReply(FindDocReply) returns (Void); 
	rpc dbUpdateDocReply(UpdateDocReply) returns (Void); 
	rpc dbDeleteDocReply(DeleteDocReply) returns (Void); 
	rpc dbInsertDocReply(InsertDocReply) returns (Void); 
	rpc dbFindAndModifyDocReply(FindAndModifyDocReq) returns (Void);
	rpc dbCountDocReply(CountDocReq) returns (Void);
	rpc redisCmdReply(RedisCommandReply) returns (Void);
	rpc redisPipelineReply(RedisPipelineReply) returns (Void);
	rpc dbBulkWriteReply(BulkWriteReply) returns (Void);
} 
