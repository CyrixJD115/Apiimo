[workspace]
members = [
    "crates/apiimo-core",
    "crates/apiimo-crypto",
    "crates/apiimo-network",
    "crates/apiimo-api",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-only"
rust-version = "1.74"

[workspace.dependencies]
apiimo-core = { path = "crates/apiimo-core", version = "0.1.0" }
apiimo-crypto = { path = "crates/apiimo-crypto", version = "0.1.0" }
apiimo-network = { path = "crates/apiimo-network", version = "0.1.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
