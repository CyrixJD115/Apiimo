[workspace]
members = [
    "apiimo-core",
    "apiimo-crypto",
    "apiimo-network",
    "apiimo-api",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "GPL-3.0-only"
rust-version = "1.74"

[workspace.dependencies]
apiimo-core = { path = "apiimo-core", version = "0.1.0" }
apiimo-crypto = { path = "apiimo-crypto", version = "0.1.0" }
apiimo-network = { path = "apiimo-network", version = "0.1.0" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ruzstd = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha1 = "0.10"
rmp = "0.8"
rmp-serde = "1"
rsa = { version = "0.9", features = ["sha1"] }
rand = "0.8"
