#   schema  - file format version, currently 1.
#   apiimo  - the apiimo release (semver) that first embedded the key.
#   manifest - Steam depot manifest id of the keyed game build, when known.
#   date    - the game build's depot date, when known.
#   note    - free-form provenance.
#   key     - the raw keystream hex, aligned to file offset zero. Length
#             must be exactly 1152 bytes (2304 hex characters).
schema = 1

